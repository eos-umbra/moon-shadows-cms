backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Блог"
    folder: "_posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Дата", name: "date", widget: "datetime"}
      - {label: "Текст", name: "body", widget: "markdown"}
      - {label: "Изображение", name: "image", widget: "image", required: false}

  - name: "predictions"
    label: "Предсказания"
    folder: "_predictions"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Текст предсказания", name: "text", widget: "string"}

  - name: "services"
    label: "Услуги"
    folder: "_services"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Название", name: "title", widget: "string"}
      - {label: "Описание", name: "description", widget: "text"}
      - {label: "Изображение", name: "image", widget: "image", required: false}

  - name: "shop"
    label: "Товары"
    folder: "_shop"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Название", name: "title", widget: "string"}
      - {label: "Описание", name: "description", widget: "text"}
      - {label: "Цена", name: "price", widget: "string", required: false}
      - {label: "Изображение", name: "image", widget: "image", required: false}
